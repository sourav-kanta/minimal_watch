
# sets up displays
CONFIG_DISPLAY=y
CONFIG_INPUT=y
#CONFIG_MAIN_STACK_SIZE=4096

#GPIO
CONFIG_GPIO=y


CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

#Shell
CONFIG_SHELL=y
CONFIG_LV_Z_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# LVGL configuration

CONFIG_LVGL=y
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_FLUSH_THREAD=n
