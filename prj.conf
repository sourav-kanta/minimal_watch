
# sets up displays
CONFIG_DISPLAY=y
CONFIG_INPUT=y
CONFIG_INPUT_LONGPRESS=y
CONFIG_MAIN_STACK_SIZE=4096

#GPIO
CONFIG_GPIO=y

#Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

#Power Management
#CONFIG_PM=y
#CONFIG_PM_DEVICE=y
#CONFIG_PM_DEVICE_RUNTIME=y

#Shell
#CONFIG_SHELL=y
#CONFIG_LV_Z_SHELL=y
#CONFIG_KERNEL_SHELL=y
#CONFIG_SYS_HEAP_RUNTIME_STATS=y

# LVGL configuration

CONFIG_LVGL=y
CONFIG_LV_Z_VDB_SIZE=50
CONFIG_LV_Z_FULL_REFRESH=n
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_BITS_PER_PIXEL=16
CONFIG_LV_Z_FLUSH_THREAD=n
CONFIG_LV_FONT_MONTSERRAT_10=y
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_USE_GRIDNAV=y
CONFIG_LV_Z_MEM_POOL_SIZE=32768

#BLE
CONFIG_BT=y
#CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_DEVICE_NAME="MIN_WATCH"
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
# BLE buffers
CONFIG_BT_L2CAP_TX_BUF_COUNT=10
CONFIG_BT_BUF_ACL_RX_COUNT_EXTRA=10
#CONFIG_BT_SMP_SC_ONLY=n
#CONFIG_BT_SMP_APP_PAIRING_ACCEPT=n
#CONFIG_BT_APP_PASSKEY=y
#CONFIG_BT_SETTINGS=y

# File System Support
#CONFIG_FILE_SYSTEM=y
#CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

#LIBC
CONFIG_PICOLIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
